name: Native and npm platform candidates

on:
  workflow_call:

permissions:
  contents: read

env:
  TWIGSMITH_DEV_FAIL_FAST: '1'

jobs:
  native:
    name: Packaged native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: X64
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            arch: X64
            target: x86_64-pc-windows-msvc
          - os: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Provision Linux executable inspection and selected shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils zsh fish
      - name: Select maintained macOS Git
        if: runner.os == 'macOS'
        run: |
          brew install git fish
          echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"
      - name: Bootstrap repository-local Rust
        if: runner.os != 'Windows'
        run: ./dev bootstrap
      - name: Build and qualify the native archive
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ARCH -ne $env:EXPECTED_ARCH) { throw 'Unexpected native architecture' }
          $toolchain = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel = "([^"]+)"').Groups[1].Value
          if (-not $toolchain) { throw 'Missing toolchain pin' }
          $env:RUSTUP_HOME = Join-Path $PWD '.dev/rustup'
          $env:CARGO_HOME = Join-Path $PWD '.dev/cargo'
          $env:CARGO_TARGET_DIR = Join-Path $PWD 'target'
          $env:RUSTUP_TOOLCHAIN = $toolchain
          $env:PATH = (Join-Path $env:CARGO_HOME 'bin') + [IO.Path]::PathSeparator + $env:PATH
          if ($env:RUNNER_OS -eq 'Windows') {
            rustup toolchain install $toolchain --profile minimal --no-self-update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git --no-lazy-fetch --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler
          if ($compiler -notcontains "host: $env:EXPECTED_TARGET") { throw 'Expected native compiler host' }
          $native = Join-Path $env:RUNNER_TEMP 'platform-native'
          $harness = Join-Path $env:RUNNER_TEMP 'platform-harness'
          python tools/native_package.py build $native --target $env:EXPECTED_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/qualify_platform.py prepare --harness-dir $harness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Get-ChildItem $native | Where-Object { $_.Name -match '\.(tar\.gz|zip)$' }
          if (@($archive).Count -ne 1) { throw 'Expected exactly one native archive' }
          python tools/qualify_platform.py run --require-shells --archive $archive.FullName --harness-dir $harness --evidence-dir (Join-Path $env:RUNNER_TEMP 'native-evidence')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-archive-${{ matrix.target }}
          path: ${{ runner.temp }}/platform-native/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-harness-${{ matrix.target }}
          path: ${{ runner.temp }}/platform-harness/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-native-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: warn
          retention-days: 30

  linux-runtime:
    name: Same Linux archive (${{ matrix.os }})
    needs: native
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Provision executable inspection
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-archive-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/platform-native
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-harness-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/platform-harness
          digest-mismatch: error
      - name: Consume the identical Linux candidate
        run: |
          archive=$(find "$RUNNER_TEMP/platform-native" -maxdepth 1 -name '*.tar.gz')
          python tools/qualify_platform.py run --archive "$archive" --harness-dir "$RUNNER_TEMP/platform-harness" --evidence-dir "$RUNNER_TEMP/native-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-linux-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: warn
          retention-days: 30

  npm-set:
    name: Assemble the complete npm candidate set
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform-archive-*
          path: ${{ runner.temp }}/native-input
          digest-mismatch: error
      - name: Bind and assemble the exact four payloads
        env:
          PACKAGE_INPUT: ${{ runner.temp }}/native-input
          PACKAGE_OUTPUT: ${{ runner.temp }}/platform-npm
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'tools')
          import native_package, npm_platform_package
          inputs = []
          for archive in pathlib.Path(os.environ['PACKAGE_INPUT']).rglob('*'):
              if archive.is_file() and archive.name.endswith(('.tar.gz', '.zip')):
                  manifest = native_package.verify(archive)
                  inputs.append({'archive': str(archive), 'archive_sha256': manifest['archive']['sha256'],
                                 'payload_sha256': manifest['files'][manifest['npm_payload']]['sha256']})
          npm_platform_package.make_package_set(pathlib.Path.cwd(), inputs, os.environ['PACKAGE_OUTPUT'])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-npm-set
          path: ${{ runner.temp }}/platform-npm/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  npm-runtime:
    name: Installed npm (${{ matrix.platform.target }}, Node ${{ matrix.node }})
    needs: npm-set
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select maintained macOS Git
        if: runner.os == 'macOS'
        run: |
          brew install git
          echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-npm-set
          path: ${{ runner.temp }}/platform-npm
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-harness-${{ matrix.platform.target }}
          path: ${{ runner.temp }}/platform-harness
          digest-mismatch: error
      - name: Qualify local npm installation and npx without install scripts
        shell: pwsh
        env:
          NODE_LINE: ${{ matrix.node }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The reference runtime covers all Git journeys. Other maintained
          # Node lines cover launcher, installation and terminal boundaries.
          $profile = if ($env:NODE_LINE -eq '24') { 'full' } else { 'launcher' }
          python tools/qualify_platform.py npm --profile $profile --package-set-dir (Join-Path $env:RUNNER_TEMP 'platform-npm') --harness-dir (Join-Path $env:RUNNER_TEMP 'platform-harness') --evidence-dir (Join-Path $env:RUNNER_TEMP 'npm-evidence')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-npm-evidence-${{ matrix.platform.target }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/npm-evidence/
          if-no-files-found: warn
          retention-days: 30
