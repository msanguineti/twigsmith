name: Rust foundation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TWIGSMITH_DEV_FAIL_FAST: '1'

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check available Git and build prerequisites
        run: |
          git --no-lazy-fetch --version
          sudo apt-get update
          sudo apt-get install --yes build-essential python3 binutils
      - name: Check release source selection
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Bootstrap repository-local Rust
        run: ./dev bootstrap
      - name: Check source and inexpensive packaging regressions
        run: ./dev check
      - name: Select npm boundary-test runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
      - name: Check packaging, release providers and site boundaries
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          ./dev test-packaging

  native-journey:
    name: Native Git journey (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: X64
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            arch: X64
            target: x86_64-pc-windows-msvc
          - os: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select maintained macOS Git
        if: runner.os == 'macOS'
        run: |
          brew install git
          echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"
      - name: Bootstrap repository-local Rust
        if: runner.os != 'Windows'
        run: ./dev bootstrap
      - name: Bootstrap native Windows Rust
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel = "([^"]+)"').Groups[1].Value
          if (-not $toolchain) { throw 'Missing Rust toolchain pin' }
          $env:RUSTUP_HOME = Join-Path $PWD '.dev/rustup'
          $env:CARGO_HOME = Join-Path $PWD '.dev/cargo'
          rustup toolchain install $toolchain --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native application journey and record environment
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "Source: $env:GITHUB_SHA; runner: $env:RUNNER_OS/$env:RUNNER_ARCH; image: $env:ImageOS/$env:ImageVersion"
          git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "Terminal harness: Unix PTY / Windows ConPTY; TERM=xterm-256color; native prompt tests require keyboard input"
          Write-Output ([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)
          $PSVersionTable.PSVersion
          if ($env:RUNNER_ARCH -ne $env:EXPECTED_ARCH) { throw 'Unexpected runner architecture' }
          $toolchain = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel = "([^"]+)"').Groups[1].Value
          if (-not $toolchain) { throw 'Missing Rust toolchain pin' }
          $env:RUSTUP_HOME = Join-Path $PWD '.dev/rustup'
          $env:CARGO_HOME = Join-Path $PWD '.dev/cargo'
          $env:CARGO_TARGET_DIR = Join-Path $PWD 'target'
          $env:RUSTUP_TOOLCHAIN = $toolchain
          $env:PATH = (Join-Path $env:CARGO_HOME 'bin') + [IO.Path]::PathSeparator + $env:PATH
          (Get-Command git -ErrorAction Stop).Source
          git --no-lazy-fetch --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git var GIT_SHELL_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Ask Git's own shell, including the bundled Git-for-Windows shell.
          # dash has no version flag; its installed package records that version.
          git -c 'alias.twigsmith-shell-version=!printf "BASH_VERSION=%s\n" "$BASH_VERSION"; if command -v dpkg-query >/dev/null 2>&1; then dpkg-query --show dash; fi' twigsmith-shell-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler
          if ($compiler -notcontains "host: $env:EXPECTED_TARGET") { throw 'Compiler must run on the intended native target' }
          # Explicit target prevents inherited Cargo configuration selecting another architecture.
          cargo build --locked --target $env:EXPECTED_TARGET --example native_check_fixture --example native_editor_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --no-fail-fast --target $env:EXPECTED_TARGET --test native_journey --test native_checks --test native_check_guards --test native_editor --test native_prompts --test cli_oneflow --test cli_direct_sequence --test cli_hosted_oneflow --test cli_hosted_recovery --test native_recovery -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target $env:EXPECTED_TARGET --lib presentation::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-completion:
    name: Native completion (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: X64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            arch: X64
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
          - os: windows-2025
            arch: X64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Provision Linux shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish zsh
          command -v bash fish zsh pwsh
          bash --version
          fish --version
          zsh --version
          zsh -dfc 'autoload -Uz compaudit; compaudit || true'
          # shellcheck disable=SC2016 # PowerShell owns this expression.
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion; if ($PSVersionTable.PSVersion -lt [version]"7.3") { exit 1 }'
      - name: Provision macOS shells
        if: runner.os == 'macOS'
        run: |
          brew install bash fish git
          {
            echo "TWIGSMITH_TEST_BASH=$(brew --prefix bash)/bin/bash"
            echo "TWIGSMITH_TEST_FISH=$(brew --prefix fish)/bin/fish"
            echo "TWIGSMITH_TEST_ZSH=/bin/zsh"
          } >> "$GITHUB_ENV"
          echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"
          command -v bash fish zsh git
          fish --version
          zsh --version
          git --version
      - name: Bootstrap repository-local Rust
        if: runner.os != 'Windows'
        run: ./dev bootstrap
      - name: Record native shell environment
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "Source: $env:GITHUB_SHA; runner: $env:RUNNER_OS/$env:RUNNER_ARCH; image: $env:ImageOS/$env:ImageVersion"
          git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output ([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)
          Write-Output 'Terminal mechanism: Unix PTY / Windows ConPTY; actual Tab input required'
          if ($env:RUNNER_ARCH -ne $env:EXPECTED_ARCH) { throw 'Unexpected runner architecture' }
          (Get-Command git -ErrorAction Stop).Source
          git --no-lazy-fetch --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Linux shell interactions and registration
        if: runner.os == 'Linux'
        run: |
          ./dev rustc -vV
          test "$(./dev rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
          command -v bash fish zsh pwsh
          ./dev test --test bash_completion --test completion_shells -- --nocapture
          ./dev test-shells --require-all
      - name: Test macOS native completion and installation boundary
        if: runner.os == 'macOS'
        run: |
          ./dev rustc -vV
          test "$(./dev rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}'
          /bin/bash --version
          /bin/zsh --version
          "$TWIGSMITH_TEST_BASH" --version
          "$TWIGSMITH_TEST_FISH" --version
          ./dev test --test native_completion
          TWIGSMITH_TEST_BASH=/bin/bash ./dev test-shells --require-all
          ./dev test-shells --require-all
      - name: Test Windows native completion and installation boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TWIGSMITH_TEST_PWSH = (Get-Command pwsh.exe -ErrorAction Stop).Source
          if ($PSVersionTable.PSVersion.Major -ne 7 -or $PSVersionTable.PSVersion.Minor -ne 6) { throw 'PowerShell 7.6 LTS is required for current Windows qualification' }
          $PSVersionTable.PSVersion
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --no-lazy-fetch --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolchain = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel = "([^"]+)"').Groups[1].Value
          if (-not $toolchain) { throw 'Missing Rust toolchain pin' }
          $env:RUSTUP_HOME = Join-Path $PWD '.dev/rustup'
          $env:CARGO_HOME = Join-Path $PWD '.dev/cargo'
          $env:CARGO_TARGET_DIR = Join-Path $PWD 'target'
          $env:RUSTUP_TOOLCHAIN = $toolchain
          rustup toolchain install $toolchain --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler
          if ($compiler -notcontains 'host: x86_64-pc-windows-msvc') { throw 'Expected native MSVC compiler' }
          $env:TWIGSMITH_TEST_CMD = $env:ComSpec
          $env:TWIGSMITH_TEST_BASH = Join-Path (Split-Path (Split-Path (Get-Command git.exe).Source)) 'bin/bash.exe'
          if (-not (Test-Path $env:TWIGSMITH_TEST_BASH)) { throw 'Missing Git Bash runtime' }
          Write-Output "cmd: $env:TWIGSMITH_TEST_CMD; Git Bash: $env:TWIGSMITH_TEST_BASH; PowerShell: $env:TWIGSMITH_TEST_PWSH"
          & $env:TWIGSMITH_TEST_CMD /d /c ver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:TWIGSMITH_TEST_BASH --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --target x86_64-pc-windows-msvc --example native_argument_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc --test native_shell_windows -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc --test native_completion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc --test native_completion powershell -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Probe historical PowerShell 7.3 syntax and argument boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Isolated historical probe, never installed into PATH or user profiles.
          $version = '7.3.12'
          $asset = "PowerShell-$version-win-x64.zip"
          $base = "https://github.com/PowerShell/PowerShell/releases/download/v$version"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest "$base/$asset" -OutFile $archive -MaximumRetryCount 2 -RetryIntervalSec 5 -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 120
          # Publisher-listed archive identity at the v7.3.12 release page.
          $expected = 'C515C7C1B5BF1E3B5AA991274E89EA0DAA8E8BD5CA08AD554ADBC514E90005F4'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ine $expected) { throw 'Historical archive hash mismatch' }
          $runtime = Join-Path $env:RUNNER_TEMP 'powershell-7.3-probe'
          Expand-Archive $archive -DestinationPath $runtime
          $env:TWIGSMITH_TEST_PWSH = Join-Path $runtime 'pwsh.exe'
          & $env:TWIGSMITH_TEST_PWSH -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolchain = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel = "([^"]+)"').Groups[1].Value
          $env:RUSTUP_HOME = Join-Path $PWD '.dev/rustup'
          $env:CARGO_HOME = Join-Path $PWD '.dev/cargo'
          $env:CARGO_TARGET_DIR = Join-Path $PWD 'target'
          $env:RUSTUP_TOOLCHAIN = $toolchain
          cargo test --locked --target x86_64-pc-windows-msvc --test native_completion powershell -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
