name: Rust foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TWIGSMITH_DEV_FAIL_FAST: '1'

jobs:
  check:
    # Preserve this build userspace until its replacement is explicitly selected.
    # ubuntu-22.04 runner retirement is distinct from Ubuntu's OS maintenance.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Provision baseline build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ca-certificates curl xz-utils python3 binutils perl libcurl4-openssl-dev libssl-dev zlib1g-dev libexpat1-dev
      - name: Build checksum-verified reference Git
        run: |
          sh scripts/ci/provision-git.sh 2.56.0 "$RUNNER_TEMP/git-2.56.0" "$RUNNER_TEMP/build-evidence/git-source"
          echo "$RUNNER_TEMP/git-2.56.0/bin" >> "$GITHUB_PATH"
      - name: Record baseline runner and userspace
        run: python3 scripts/ci/record-environment.py "$RUNNER_TEMP/build-evidence/runner.json"
      - name: Bootstrap repository-local Rust
        run: ./dev bootstrap
      - name: Check foundation
        run: ./dev check
      - name: Package identified native source
        id: package
        run: ./dev package-native "$RUNNER_TEMP/native-candidate"
      - name: Prepare reusable artifact fixture harnesses
        run: |
          ./dev native-qualify prepare --harness-dir "$RUNNER_TEMP/native-harness"
          tar -czf "$RUNNER_TEMP/native-candidate/harness.tar.gz" -C "$RUNNER_TEMP/native-harness" .
          cd "$RUNNER_TEMP/native-candidate"
          sha256sum harness.tar.gz > harness.tar.gz.sha256
      - name: Qualify the extracted baseline artifact with reference Git
        run: sh scripts/ci/qualify-candidate.sh "$RUNNER_TEMP/native-candidate" "$RUNNER_TEMP/baseline-runtime" broad "$RUNNER_TEMP/git-2.56.0/bin/git"
      - name: Retain intact candidate and reusable fixture bytes
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/native-candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain baseline qualification and provisioning evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-baseline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-evidence/
            ${{ runner.temp }}/baseline-runtime/evidence/
          if-no-files-found: warn
          retention-days: 30

  native-runtime:
    name: Native artifact (${{ matrix.os }}, Git ${{ matrix.git }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            git: 2.45.4
            profile: floor
          - os: ubuntu-24.04
            git: 2.56.0
            profile: representative
          - os: ubuntu-26.04
            git: 2.56.0
            profile: representative
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out qualification tools at the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the baseline candidate without rebuilding it
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/native-candidate
          digest-mismatch: error
      - name: Provision Git build and qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ca-certificates curl xz-utils python3 binutils perl libcurl4-openssl-dev libssl-dev zlib1g-dev libexpat1-dev
      - name: Build independently selected checksum-verified Git
        env:
          QUALIFICATION_GIT: ${{ matrix.git }}
        run: |
          sh scripts/ci/provision-git.sh "$QUALIFICATION_GIT" "$RUNNER_TEMP/qualification-git" "$RUNNER_TEMP/runtime-evidence/git-source"
          echo "$RUNNER_TEMP/qualification-git/bin" >> "$GITHUB_PATH"
      - name: Qualify the identical extracted candidate
        env:
          QUALIFICATION_PROFILE: ${{ matrix.profile }}
        run: sh scripts/ci/qualify-candidate.sh "$RUNNER_TEMP/native-candidate" "$RUNNER_TEMP/runtime" "$QUALIFICATION_PROFILE" "$RUNNER_TEMP/qualification-git/bin/git"
      - name: Retain userspace, source-integrity and workflow evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-${{ matrix.os }}-git-${{ matrix.git }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-evidence/
            ${{ runner.temp }}/runtime/evidence/
          if-no-files-found: warn
          retention-days: 30

  native-completion:
    name: Native completion (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Provision Linux shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish zsh
          command -v bash fish zsh pwsh
          bash --version
          fish --version
          zsh --version
          zsh -dfc 'autoload -Uz compaudit; compaudit || true'
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion; if ($PSVersionTable.PSVersion -lt [version]"7.3") { exit 1 }'
      - name: Provision macOS shells
        if: runner.os == 'macOS'
        run: |
          brew install bash fish git
          echo "TWIGSMITH_TEST_BASH=$(brew --prefix bash)/bin/bash" >> "$GITHUB_ENV"
          command -v bash fish zsh git
          fish --version
          zsh --version
          git --version
      - name: Bootstrap repository-local Rust
        if: runner.os != 'Windows'
        run: ./dev bootstrap
      - name: Test Linux shell interactions and registration
        if: runner.os == 'Linux'
        run: ./dev test-shells --require-all
      - name: Test macOS native completion and installation boundary
        if: runner.os == 'macOS'
        run: |
          ./dev test --test native_completion
          ./dev test-shells --require-all
      - name: Test Windows native completion and installation boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TWIGSMITH_TEST_PWSH = (Get-Command pwsh.exe -ErrorAction Stop).Source
          if ($PSVersionTable.PSVersion -lt [version]'7.3') { throw 'PowerShell 7.3 or newer is required for this environment' }
          $PSVersionTable.PSVersion
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --no-lazy-fetch --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolchain = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel = "([^"]+)"').Groups[1].Value
          if (-not $toolchain) { throw 'Missing Rust toolchain pin' }
          $env:RUSTUP_HOME = Join-Path $PWD '.dev/rustup'
          $env:CARGO_HOME = Join-Path $PWD '.dev/cargo'
          $env:CARGO_TARGET_DIR = Join-Path $PWD 'target'
          $env:RUSTUP_TOOLCHAIN = $toolchain
          rustup toolchain install $toolchain --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test native_completion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test native_completion powershell -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
