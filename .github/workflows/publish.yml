name: Publish approved prerelease

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a candidate or publish an approved immutable candidate
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true
      request:
        description: Reviewed JSON request (see development guide)
        type: string
        required: true
      deploy_pages:
        description: Deploy the verified site after publication (requires separate owner authorization)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: twigsmith-release
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.operation == 'prepare' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Inspect the approved native run and artifact
        id: input
        env:
          REQUEST_JSON: ${{ inputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"request.json").write_text(os.environ["REQUEST_JSON"])'
          python3 tools/release_stage.py inspect-prepare "$RUNNER_TEMP/request.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.input.outputs.artifact_id }}
          run-id: ${{ steps.input.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-input
          merge-multiple: true
          digest-mismatch: error
      - name: Assemble a new candidate without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_stage.py prepare "$RUNNER_TEMP/request.json" --input "$RUNNER_TEMP/native-input" --output "$RUNNER_TEMP/release-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  preflight:
    if: inputs.operation == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_id: ${{ steps.input.outputs.run_id }}
      artifact_id: ${{ steps.input.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect the approved preparation run and artifact
        id: input
        env:
          REQUEST_JSON: ${{ inputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"request.json").write_text(os.environ["REQUEST_JSON"])'
          python3 tools/release_stage.py inspect-publish "$RUNNER_TEMP/request.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.input.outputs.artifact_id }}
          run-id: ${{ steps.input.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
          merge-multiple: true
          digest-mismatch: error
      - run: python3 tools/release_stage.py validate "$RUNNER_TEMP/request.json" --input "$RUNNER_TEMP/release-candidate"

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
          merge-multiple: true
          digest-mismatch: error
      - name: Recheck identity and resume publication
        env:
          REQUEST_JSON: ${{ inputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"request.json").write_text(os.environ["REQUEST_JSON"])'
          python3 tools/release_stage.py validate "$RUNNER_TEMP/request.json" --input "$RUNNER_TEMP/release-candidate"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          request = json.loads((root / 'request.json').read_text())
          approval = request['approval']
          path = root / 'approval.json'
          path.write_text(json.dumps(approval))
          subprocess.run(['python3', 'tools/release_publish.py',
              str(root / 'release-candidate/native' / approval['native']['archive']),
              str(root / 'release-candidate/npm'), '--approval', str(path), '--execute',
              '--receipt-output', str(root / 'consumption.json'),
              '--site-directory', str(root / 'pages')], check=True)
          PY
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: inputs.deploy_pages
        with:
          path: ${{ runner.temp }}/pages

  deploy-pages:
    needs: publish
    if: inputs.deploy_pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
