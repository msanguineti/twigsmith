name: Publish approved prerelease

on:
  workflow_run:
    workflows: [Native release qualification]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a candidate or publish an approved immutable candidate
        type: choice
        options: [prepare, publish, publish-platforms]
        default: prepare
        required: true
      request:
        description: Reviewed JSON request (see development guide)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: twigsmith-release
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.operation == 'prepare' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Inspect the approved native run and artifact
        id: input
        env:
          REQUEST_JSON: ${{ inputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"request.json").write_text(os.environ["REQUEST_JSON"])'
          python3 tools/release_stage.py inspect-prepare "$RUNNER_TEMP/request.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.input.outputs.artifact_id }}
          run-id: ${{ steps.input.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-input
          merge-multiple: true
          digest-mismatch: error
      - name: Assemble a new candidate without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_stage.py prepare "$RUNNER_TEMP/request.json" --input "$RUNNER_TEMP/native-input" --output "$RUNNER_TEMP/release-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'publish') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_id: ${{ steps.input.outputs.run_id }}
      artifact_id: ${{ steps.input.outputs.artifact_id }}
      request: ${{ steps.final.outputs.request }}
      deploy: ${{ steps.final.outputs.deploy }}
      version: ${{ steps.final.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect the release event run
        id: event
        if: github.event_name == 'workflow_run'
        env:
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          TRIGGER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_stage.py inspect-event /dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'workflow_run'
        with:
          artifact-ids: ${{ steps.event.outputs.artifact_id }}
          run-id: ${{ steps.event.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-event
          merge-multiple: true
          digest-mismatch: error
      - name: Bind the original release and previously prepared candidate
        if: github.event_name == 'workflow_run'
        env:
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          TRIGGER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_stage.py event-request "$RUNNER_TEMP/release-event/release-event.json" --output "$RUNNER_TEMP/request.json"
      - name: Read the manual request
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUEST_JSON: ${{ inputs.request }}
        run: python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"request.json").write_text(os.environ["REQUEST_JSON"])'
      - name: Inspect the approved preparation run and artifact
        id: input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_stage.py inspect-publish "$RUNNER_TEMP/request.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.input.outputs.artifact_id }}
          run-id: ${{ steps.input.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
          merge-multiple: true
          digest-mismatch: error
      - run: python3 tools/release_stage.py validate "$RUNNER_TEMP/request.json" --input "$RUNNER_TEMP/release-candidate"
      - name: Select verified publication and Pages behavior
        id: final
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re
          data = pathlib.Path(os.environ['RUNNER_TEMP'], 'request.json').read_bytes()
          request = json.loads(data)
          stable = request['approval']['publication']['prerelease'] is False
          version = request['approval']['version']
          if not isinstance(version, str) or not re.fullmatch(r'[0-9A-Za-z.-]+', version):
              raise ValueError('invalid approved version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('request=' + base64.b64encode(data).decode() + '\n')
              out.write('deploy=' + str(stable).lower() + '\n')
              out.write('version=' + version + '\n')
          PY

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
          merge-multiple: true
          digest-mismatch: error
      - name: Recheck identity and resume publication
        env:
          REQUEST_BASE64: ${{ needs.preflight.outputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"request.json").write_bytes(base64.b64decode(os.environ["REQUEST_BASE64"], validate=True))'
          python3 tools/release_stage.py validate "$RUNNER_TEMP/request.json" --input "$RUNNER_TEMP/release-candidate"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          request = json.loads((root / 'request.json').read_text())
          approval = request['approval']
          path = root / 'approval.json'
          path.write_text(json.dumps(approval))
          command = ['python3', 'tools/release_publish.py',
              str(root / 'release-candidate/native' / approval['native']['archive']),
              str(root / 'release-candidate/npm'), '--approval', str(path), '--execute',
              '--receipt-output', str(root / 'consumption.json')]
          if not approval['publication']['prerelease']:
              command += ['--site-directory', str(root / 'pages')]
          subprocess.run(command, check=True)
          PY
  deploy-pages:
    needs: [preflight, publish]
    if: needs.preflight.outputs.deploy == 'true'
    uses: ./.github/workflows/site.yml
    with:
      expected_version: ${{ needs.preflight.outputs.version }}
    permissions:
      contents: read
      pages: write
      id-token: write

  platform-preflight:
    if: inputs.operation == 'publish-platforms' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      request: ${{ steps.input.outputs.request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect and acquire the independently approved complete set
        id: input
        env:
          REQUEST_JSON: ${{ inputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          data = os.environ['REQUEST_JSON'].encode()
          pathlib.Path(os.environ['RUNNER_TEMP'], 'platform-request.json').write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('request=' + base64.b64encode(data).decode() + '\n')
          PY
          python3 tools/release_platform_dispatch.py acquire "$RUNNER_TEMP/platform-request.json" --bundle "$RUNNER_TEMP/platform-publication"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-publication-input-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-publication/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  platform-stage:
    needs: platform-preflight
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-publication-input-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-publication
          digest-mismatch: error
      - name: Recover exact assets and packages without advertising the RC
        env:
          REQUEST_BASE64: ${{ needs.platform-preflight.outputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"platform-request.json").write_bytes(base64.b64decode(os.environ["REQUEST_BASE64"], validate=True))'
          python3 tools/release_platform_dispatch.py stage "$RUNNER_TEMP/platform-request.json" --bundle "$RUNNER_TEMP/platform-publication"

  platform-consume:
    name: Public installation (${{ matrix.target }})
    needs: [platform-preflight, platform-stage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Select maintained macOS Git
        if: runner.os == 'macOS'
        run: |
          brew install git
          echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"
      - name: Read exact public identity and native harness provenance
        id: input
        shell: pwsh
        env:
          REQUEST_BASE64: ${{ needs.platform-preflight.outputs.request }}
          PUBLIC_TARGET: ${{ matrix.target }}
        run: |
          @'
          import base64, json, os, pathlib
          request = json.loads(base64.b64decode(os.environ['REQUEST_BASE64'], validate=True))
          approval = request['approval']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'public-approval.json').write_text(json.dumps(approval), encoding='utf-8')
          native = next(item for item in approval['native'] if item['target'] == os.environ['PUBLIC_TARGET'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('run=' + native['artifact']['run_id'] + '\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-harness-${{ matrix.target }}
          run-id: ${{ steps.input.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/public-harness
          digest-mismatch: error
      - name: Consume exact public native, npm and npx routes anonymously
        shell: pwsh
        env:
          PUBLIC_TARGET: ${{ matrix.target }}
        run: |
          python tools/qualify_public_release.py --approval (Join-Path $env:RUNNER_TEMP 'public-approval.json') --target $env:PUBLIC_TARGET --harness-dir (Join-Path $env:RUNNER_TEMP 'public-harness') --evidence-dir (Join-Path $env:RUNNER_TEMP 'public-consumption')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-consumption-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-consumption/
          if-no-files-found: error
          retention-days: 30

  platform-promote:
    needs: [platform-preflight, platform-stage, platform-consume]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-publication-input-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-publication
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: public-consumption-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-evidence
          digest-mismatch: error
      - name: Authenticate every consumer row and promote only the verified RC
        env:
          REQUEST_BASE64: ${{ needs.platform-preflight.outputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"platform-request.json").write_bytes(base64.b64decode(os.environ["REQUEST_BASE64"], validate=True))'
          python3 tools/release_platform_dispatch.py promote "$RUNNER_TEMP/platform-request.json" --bundle "$RUNNER_TEMP/platform-publication" --evidence "$RUNNER_TEMP/public-evidence"
