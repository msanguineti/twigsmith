name: Publish approved release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish an approved candidate or promote a publicly verified candidate
        type: choice
        options: [publish-platforms, promote-platforms]
        default: publish-platforms
        required: true
      request:
        description: Reviewed JSON request (see development guide)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: twigsmith-release
  cancel-in-progress: false

jobs:
  platform-preflight:
    if: contains(fromJSON('["publish-platforms", "promote-platforms"]'), inputs.operation) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      request: ${{ steps.input.outputs.request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect and acquire the independently approved complete set
        id: input
        env:
          REQUEST_JSON: ${{ inputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          data = os.environ['REQUEST_JSON'].encode()
          pathlib.Path(os.environ['RUNNER_TEMP'], 'platform-request.json').write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('request=' + base64.b64encode(data).decode() + '\n')
          PY
          python3 tools/release_platform_dispatch.py acquire "$RUNNER_TEMP/platform-request.json" --bundle "$RUNNER_TEMP/platform-publication"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-publication-input-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-publication/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  platform-stage:
    if: inputs.operation == 'publish-platforms'
    needs: platform-preflight
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-publication-input-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-publication
          digest-mismatch: error
      - name: Recover exact assets and package without advertising the release
        env:
          REQUEST_BASE64: ${{ needs.platform-preflight.outputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"platform-request.json").write_bytes(base64.b64decode(os.environ["REQUEST_BASE64"], validate=True))'
          python3 tools/release_platform_dispatch.py stage "$RUNNER_TEMP/platform-request.json" --bundle "$RUNNER_TEMP/platform-publication"

  platform-consume:
    name: Public installation (${{ matrix.target }})
    needs: [platform-preflight, platform-stage]
    if: >-
      !cancelled() && needs.platform-preflight.result == 'success' &&
      ((inputs.operation == 'publish-platforms' && needs.platform-stage.result == 'success') ||
       (inputs.operation == 'promote-platforms' && needs.platform-stage.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Select the public-consumer npm client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:RUNNER_TEMP 'public-consumer-npm'
          npm install --global --prefix $prefix npm@12.2.1 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($env:RUNNER_OS -eq 'Windows') { $prefix } else { Join-Path $prefix 'bin' }
          $relativeCli = if ($env:RUNNER_OS -eq 'Windows') { 'node_modules/npm/bin/npm-cli.js' } else { 'lib/node_modules/npm/bin/npm-cli.js' }
          $actual = & node (Join-Path $prefix $relativeCli) --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual.Trim() -ne '12.2.1') { throw 'Selected public-consumer npm version differs' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Select maintained macOS Git
        if: runner.os == 'macOS'
        run: |
          brew install git
          echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"
      - name: Read exact public identity and native harness provenance
        id: input
        shell: pwsh
        env:
          REQUEST_BASE64: ${{ needs.platform-preflight.outputs.request }}
          PUBLIC_TARGET: ${{ matrix.target }}
        run: |
          @'
          import base64, json, os, pathlib
          request = json.loads(base64.b64decode(os.environ['REQUEST_BASE64'], validate=True))
          approval = request['approval']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'public-approval.json').write_text(json.dumps(approval), encoding='utf-8')
          native = next(item for item in approval['native'] if item['target'] == os.environ['PUBLIC_TARGET'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('run=' + native['artifact']['run_id'] + '\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-harness-${{ matrix.target }}
          run-id: ${{ steps.input.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/public-harness
          digest-mismatch: error
      - name: Consume exact public native, npm and npx routes anonymously
        shell: pwsh
        env:
          PUBLIC_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node --version).Trim() -ne 'v24.22.2') { throw 'Unexpected public-consumer Node runtime' }
          $actual = @'
          import subprocess, sys
          from types import SimpleNamespace
          sys.path.insert(0, 'tools')
          import qualify_platform
          print(subprocess.check_output(qualify_platform.npm_invocation(SimpleNamespace(npm=None)) + ['--version'], text=True).strip())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual.Trim() -ne '12.2.1') { throw 'The public qualifier npm invocation differs from its selected client' }
          python tools/qualify_public_release.py --approval (Join-Path $env:RUNNER_TEMP 'public-approval.json') --target $env:PUBLIC_TARGET --harness-dir (Join-Path $env:RUNNER_TEMP 'public-harness') --evidence-dir (Join-Path $env:RUNNER_TEMP 'public-consumption')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-consumption-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-consumption/
          if-no-files-found: error
          retention-days: 30

  platform-promote:
    needs: [platform-preflight, platform-consume]
    if: >-
      !cancelled() && inputs.operation == 'promote-platforms' &&
      needs.platform-preflight.result == 'success' && needs.platform-consume.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-publication-input-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-publication
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: public-consumption-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-evidence
          digest-mismatch: error
      - name: Authenticate every consumer row and promote only the verified release
        env:
          REQUEST_BASE64: ${{ needs.platform-preflight.outputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"platform-request.json").write_bytes(base64.b64decode(os.environ["REQUEST_BASE64"], validate=True))'
          python3 tools/release_platform_dispatch.py promote "$RUNNER_TEMP/platform-request.json" --bundle "$RUNNER_TEMP/platform-publication" --evidence "$RUNNER_TEMP/public-evidence"
