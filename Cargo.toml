[package]
name = "twigsmith"
version = "0.1.0-beta.1"
edition = "2024"
publish = false
default-run = "twigsmith"
license = "MIT"
description = "Git workflow CLI for starting, saving, and finishing work"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1", features = ["pty", "process"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1", features = ["process", "fs"] }
signal-hook = { version = "0.4.5", default-features = false }

[dependencies]
clap = { version = "4.6", features = ["unstable-ext"] }
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
indicatif = "0.18"
console = "0.16"
tempfile = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize", "serialize"] }
serde_json = "1.0.151"
toml = { version = "1.1.7", default-features = false, features = ["parse", "display", "serde", "std"] }
