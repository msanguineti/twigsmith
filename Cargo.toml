[package]
name = "git-oneflow"
version = "0.0.0-dev"
edition = "2024"
publish = false
default-run = "git-oneflow"
license = "MIT"
description = "Git workflow CLI for starting, saving, and finishing work"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1", features = ["pty", "process"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1", features = ["process", "fs"] }
signal-hook = { version = "0.4.5", default-features = false }

[dependencies]
tempfile = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize", "serialize"] }
serde_json = "1.0.151"
toml = { version = "1.1.7", default-features = false, features = ["parse", "display", "serde", "std"] }
unicode-general-category = "1.1"
unicode-normalization = "0.1"
