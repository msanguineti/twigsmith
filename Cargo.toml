[package]
name = "git-oneflow"
version = "0.0.0-dev"
edition = "2024"
publish = false
default-run = "git-oneflow"
license = "MIT"
description = "Development skeleton for the native git-oneflow CLI"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1", features = ["pty", "process"] }

[dependencies]
unicode-general-category = "1.1"
unicode-normalization = "0.1"
