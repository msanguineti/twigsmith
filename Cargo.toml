[package]
name = "git-oneflow"
version = "0.0.0-dev"
edition = "2024"
publish = false
default-run = "git-oneflow"
license = "MIT"
description = "Development skeleton for the native git-oneflow CLI"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1", features = ["pty", "process"] }

[dependencies]
serde = "1.0.229"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
toml = { version = "1.1.7", default-features = false, features = ["parse", "serde", "std"] }
unicode-general-category = "1.1"
unicode-normalization = "0.1"
